        body { background-color: #fcf9f8; }
        .shadow-warm { box-shadow: 0 10px 25px -5px rgba(122, 32, 72, 0.05), 0 8px 10px -6px rgba(122, 32, 72, 0.05); }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation Hidden as this is a linear transactional success screen -->
<main class="w-full max-w-md mx-auto flex flex-col items-center gap-8 py-12">
<!-- Header Section -->
<div class="text-center space-y-4">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-2">
<span class="material-symbols-outlined text-4xl" data-icon="check_circle">check_circle</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">¡Reserva Confirmada!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                Tu lugar en El Origen está asegurado. Te esperamos para una experiencia inolvidable.
            </p>
</div>
<!-- Ticket Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-warm border border-surface-variant w-full relative overflow-hidden">
<!-- Decorative Mountain Line Motif Top -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-20"></div>
<div class="space-y-6">
<!-- Experience Details -->
<div class="text-center space-y-2 border-b border-surface-variant pb-6">
<h2 class="font-headline-sm text-headline-sm text-primary">Cata Terroir de Altura</h2>
<p class="font-label-caps text-label-caps text-secondary tracking-widest uppercase">ID de Reserva: #ORG-8924</p>
</div>
<!-- Summary Grid -->
<div class="grid grid-cols-2 gap-y-6 gap-x-4">
<div>
<p class="font-label-caps text-label-caps text-secondary mb-1">Fecha</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">15 Oct 2024</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-secondary mb-1">Hora</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">16:30 hrs</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-secondary mb-1">Personas</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">2 Adultos</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-secondary mb-1">Ubicación</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">Sala Principal</p>
</div>
</div>
<!-- Terroir Divider -->
<div class="relative py-4 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-dashed border-outline-variant"></div>
</div>
<div class="relative bg-surface-container-lowest px-4">
<span class="material-symbols-outlined text-outline" data-icon="landscape">landscape</span>
</div>
</div>
<!-- QR Code -->
<div class="flex flex-col items-center space-y-3 pt-2">
<img class="w-48 h-48 object-contain" data-alt="A clean, minimalist QR code image centered on a crisp white background. The QR code features sharp black modules and square alignment markers. The overall aesthetic is functional, modern, and high-contrast, fitting seamlessly into a premium mobile ticketing interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCr8XbVw5L8lkL1ErLjpHdZwV8GtwH_cR6HRxmC9VMfoH2czxzOWPc9HUJZLIHn_vm_JYD-wHD1EzlPK-naZi6jTb5S0bJ7AGsxg8wyLTwbClsLXYxQpYKKvl_HTtQU2HW1pxSAi5J_K-whV6Xf-uol0Q5fgdDi2nJ6EWO63tdqf4lXDG60UqoFKvDVmJ2dn8Q279Oz0qm5vq39qTIVPIODlYXsNJMiH2KsjSvIM-P1yG_2ehy5I3-8Mw"/>
<p class="font-label-caps text-label-caps text-secondary text-center">Muestra este código al llegar</p>
</div>
</div>
<!-- Decorative Mountain Line Motif Bottom -->
<div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-20"></div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4 mt-4">
<button class="w-full bg-primary-container text-on-primary font-body-md text-body-md font-bold py-4 rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="download">download</span>
                Guardar ticket
            </button>
<button class="w-full bg-transparent border border-primary text-primary font-body-md text-body-md font-bold py-4 rounded-xl hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="home">home</span>
                Volver al inicio
            </button>
